<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="RouterDash: a beautiful dashboard for your GTPL router">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11151c"/>
      <stop offset="1" stop-color="#1b1410"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#ff6a00" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1f28"/>
      <stop offset="1" stop-color="#151920"/>
    </linearGradient>
    <clipPath id="phoneClip"><rect x="884" y="58" width="236" height="470" rx="34"/></clipPath>
  </defs>

  <rect width="1280" height="440" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="28" fill="url(#glow)"/>

  <!-- faint signal rings -->
  <g fill="none" stroke="#ff6a00" stroke-opacity=".08" stroke-width="2">
    <circle cx="1002" cy="250" r="230"/><circle cx="1002" cy="250" r="300"/><circle cx="1002" cy="250" r="370"/>
  </g>

  <!-- logo -->
  <rect x="80" y="86" width="72" height="72" rx="20" fill="#ff6a00"/>
  <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round">
    <path d="M97 120a27 27 0 0 1 38 0"/><path d="M105 130a15 15 0 0 1 22 0"/><path d="M89 110a39 39 0 0 1 54 0"/>
  </g>
  <circle cx="116" cy="141" r="4" fill="#fff"/>

  <text x="80" y="230" fill="#f4f5f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-2">RouterDash</text>
  <text x="170" y="118" fill="#c9ced8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="3">VERSAURA</text>
  <text x="170" y="142" fill="#8a93a3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14">Home network tools</text>
  <text x="82" y="278" fill="#c9ced8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="500">Your home Wi-Fi, finally in your hands.</text>

  <!-- feature pills -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#f4f5f7">
    <rect x="80" y="318" width="132" height="38" rx="19" fill="#ffffff" fill-opacity=".08"/><text x="146" y="343" text-anchor="middle">Live speed</text>
    <rect x="222" y="318" width="118" height="38" rx="19" fill="#ffffff" fill-opacity=".08"/><text x="281" y="343" text-anchor="middle">Devices</text>
    <rect x="350" y="318" width="142" height="38" rx="19" fill="#ffffff" fill-opacity=".08"/><text x="421" y="343" text-anchor="middle">Speed limits</text>
    <rect x="502" y="318" width="124" height="38" rx="19" fill="#ffffff" fill-opacity=".08"/><text x="564" y="343" text-anchor="middle">Bedtimes</text>
    <rect x="636" y="318" width="118" height="38" rx="19" fill="#ff6a00" fill-opacity=".9"/><text x="695" y="343" text-anchor="middle">Activity</text>
  </g>

  <!-- phone -->
  <rect x="876" y="50" width="252" height="486" rx="42" fill="#0a0c10" stroke="#2a303b" stroke-width="2"/>
  <g clip-path="url(#phoneClip)">
    <rect x="884" y="58" width="236" height="470" fill="url(#screen)"/>
    <text x="906" y="104" fill="#eef0f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Camnex CNP4000A</text>
    <circle cx="910" cy="121" r="4" fill="#2bc76d"/>
    <text x="920" y="125" fill="#8a93a3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Internet connected · PPPoE</text>

    <!-- ring -->
    <circle cx="1002" cy="226" r="66" fill="none" stroke="#232a35" stroke-width="12"/>
    <circle cx="1002" cy="226" r="66" fill="none" stroke="#5b9bff" stroke-width="12" stroke-linecap="round" stroke-dasharray="290 415" transform="rotate(-90 1002 226)"/>
    <circle cx="1002" cy="226" r="50" fill="none" stroke="#ff8a33" stroke-width="7" stroke-linecap="round" stroke-dasharray="120 314" transform="rotate(-90 1002 226)"/>
    <text x="1002" y="214" text-anchor="middle" fill="#8a93a3" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" letter-spacing="1">ONLINE</text>
    <text x="1002" y="242" text-anchor="middle" fill="#eef0f4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="700">4</text>

    <rect x="900" y="312" width="98" height="46" rx="12" fill="#1f2530"/>
    <text x="911" y="330" fill="#8a93a3" font-family="-apple-system, sans-serif" font-size="10">Download</text>
    <text x="911" y="349" fill="#eef0f4" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">14.5 Mbps</text>
    <rect x="1006" y="312" width="98" height="46" rx="12" fill="#1f2530"/>
    <text x="1017" y="330" fill="#8a93a3" font-family="-apple-system, sans-serif" font-size="10">Upload</text>
    <text x="1017" y="349" fill="#eef0f4" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">1.2 Mbps</text>

    <!-- sparkline -->
    <path d="M900 410 L918 398 L936 402 L954 384 L972 390 L990 372 L1008 380 L1026 366 L1044 376 L1062 360 L1080 368 L1104 352 L1104 420 L900 420 Z" fill="#5b9bff" fill-opacity=".16"/>
    <path d="M900 410 L918 398 L936 402 L954 384 L972 390 L990 372 L1008 380 L1026 366 L1044 376 L1062 360 L1080 368 L1104 352" fill="none" stroke="#5b9bff" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- device rows -->
    <rect x="900" y="436" width="204" height="40" rx="12" fill="#1f2530"/>
    <text x="912" y="454" fill="#eef0f4" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Akash's iPhone</text>
    <text x="912" y="468" fill="#8a93a3" font-family="-apple-system, sans-serif" font-size="10">5 GHz · YouTube</text>
    <text x="1094" y="462" text-anchor="end" fill="#eef0f4" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">↓ 11.8</text>
    <rect x="900" y="482" width="204" height="40" rx="12" fill="#1f2530"/>
    <text x="912" y="500" fill="#eef0f4" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Living room TV</text>
    <text x="912" y="514" fill="#8a93a3" font-family="-apple-system, sans-serif" font-size="10">≤ 10 Mbps · Netflix</text>
    <text x="1094" y="508" text-anchor="end" fill="#eef0f4" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">↓ 0.4</text>
  </g>
</svg>
