<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Three RouterDash screens: devices, activity timeline and speed limits">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f4f1"/><stop offset="1" stop-color="#ece8e3"/></linearGradient>
    <style>
      .f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
      .h{font-size:17px;font-weight:700;fill:#14171c}
      .t{font-size:12.5px;font-weight:600;fill:#14171c}
      .s{font-size:10.5px;fill:#6b7280}
      .cap{font-size:20px;font-weight:700;fill:#14171c}
      .capS{font-size:14px;fill:#6b7280}
      .lbl{font-size:9.5px;font-weight:700;fill:#6b7280;letter-spacing:.8px}
    </style>
  </defs>
  <rect width="1280" height="640" rx="28" fill="url(#bg2)"/>

  <!-- ============ Phone 1: Devices ============ -->
  <g transform="translate(96,40)">
    <rect width="300" height="520" rx="40" fill="#14171c"/>
    <rect x="8" y="8" width="284" height="504" rx="33" fill="#f3f4f7"/>
    <text x="28" y="60" class="f h">Devices</text>
    <g class="f">
      <rect x="24" y="76" width="44" height="24" rx="9" fill="#14171c"/><text x="46" y="92" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">All</text>
      <rect x="74" y="76" width="54" height="24" rx="9" fill="#e6e8ee"/><text x="101" y="92" text-anchor="middle" font-size="11" font-weight="600" fill="#14171c">5 GHz</text>
      <rect x="134" y="76" width="62" height="24" rx="9" fill="#e6e8ee"/><text x="165" y="92" text-anchor="middle" font-size="11" font-weight="600" fill="#14171c">2.4 GHz</text>
    </g>
    <rect x="20" y="112" width="260" height="300" rx="18" fill="#fff"/>
    <!-- rows -->
    <g class="f">
      <rect x="34" y="128" width="34" height="34" rx="10" fill="#f1f2f6"/><rect x="46.0" y="137.0" width="10" height="16" rx="2.5" fill="none" stroke="#14171c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M49.5 150.0h3" fill="none" stroke="#14171c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="80" y="142" class="t">Akash's iPhone</text>
      <rect x="181" y="131" width="58" height="15" rx="7.5" fill="#ff6a00" fill-opacity=".14"/><text x="210" y="142" text-anchor="middle" font-size="9" font-weight="600" fill="#ff6a00">full speed</text>
      <text x="80" y="158" class="s">5 GHz · 192.168.1.2</text>
      <text x="266" y="158" text-anchor="end" font-size="11" font-weight="700" fill="#14171c">↓ 11.8</text>

      <line x1="34" y1="176" x2="266" y2="176" stroke="#e6e8ee"/>
      <rect x="34" y="188" width="34" height="34" rx="10" fill="#f1f2f6"/><rect x="43.0" y="199.0" width="16" height="10" rx="1.5" fill="none" stroke="#14171c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M41.0 212.0h20" fill="none" stroke="#14171c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="80" y="202" class="t">This Mac</text>
      <rect x="142" y="191" width="48" height="15" rx="7.5" fill="#ff6a00" fill-opacity=".14"/><text x="166" y="202" text-anchor="middle" font-size="9" font-weight="600" fill="#ff6a00">this Mac</text>
      <text x="80" y="218" class="s">5 GHz · 192.168.1.3</text>
      <text x="266" y="218" text-anchor="end" font-size="11" font-weight="700" fill="#14171c">↓ 2.3</text>

      <line x1="34" y1="236" x2="266" y2="236" stroke="#e6e8ee"/>
      <rect x="34" y="248" width="34" height="34" rx="10" fill="#f1f2f6"/><rect x="42.0" y="259.0" width="18" height="11" rx="1.5" fill="none" stroke="#14171c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M47.0 274.0h8" fill="none" stroke="#14171c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="80" y="262" class="t">Living room TV</text>
      <rect x="181" y="251" width="64" height="15" rx="7.5" fill="#e6e8ee"/><text x="213" y="262" text-anchor="middle" font-size="9" font-weight="600" fill="#6b7280">≤ 10 Mbps</text>
      <text x="80" y="278" class="s">5 GHz · 192.168.1.4</text>
      <text x="266" y="278" text-anchor="end" font-size="11" font-weight="700" fill="#14171c">↓ 0.4</text>

      <line x1="34" y1="296" x2="266" y2="296" stroke="#e6e8ee"/>
      <rect x="34" y="308" width="34" height="34" rx="10" fill="#f1f2f6"/><rect x="46.0" y="317.0" width="10" height="16" rx="2.5" fill="none" stroke="#14171c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M49.5 330.0h3" fill="none" stroke="#14171c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="80" y="322" class="t">Kid's tablet</text>
      <rect x="160" y="311" width="48" height="15" rx="7.5" fill="#e5484d" fill-opacity=".14"/><text x="184" y="322" text-anchor="middle" font-size="9" font-weight="600" fill="#e5484d">blocked</text>
      <text x="80" y="338" class="s">2.4 GHz · 192.168.1.7</text>
      <text x="266" y="338" text-anchor="end" font-size="11" font-weight="700" fill="#14171c">↓ 0</text>

      <line x1="34" y1="356" x2="266" y2="356" stroke="#e6e8ee"/>
      <rect x="34" y="368" width="34" height="34" rx="10" fill="#f1f2f6"/><path d="M48.0 376.0v4M54.0 376.0v4M45.0 380.0h12v4a6 6 0 0 1-12 0zM51.0 390.0v4" fill="none" stroke="#14171c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="80" y="382" class="t">Phone / tablet</text>
      <text x="80" y="398" class="s">Wired / idle · 192.168.1.6</text>
    </g>
    <!-- tab bar -->
    <rect x="8" y="456" width="284" height="56" rx="33" fill="#ffffff"/><rect x="8" y="456" width="284" height="28" fill="#ffffff"/><line x1="8" y1="456" x2="292" y2="456" stroke="#e6e8ee"/>
    <g class="f" font-size="9" font-weight="600" text-anchor="middle" fill="#6b7280">
      <text x="44" y="492">Home</text><text x="100" y="492" fill="#ff6a00">Devices</text><text x="152" y="492">Activity</text><text x="206" y="492">Schedules</text><text x="258" y="492">Tools</text>
    </g>
    <text x="150" y="560" text-anchor="middle" class="f cap">See every device</text>
    <text x="150" y="582" text-anchor="middle" class="f capS">Band, IP, live speed, status</text>
  </g>

  <!-- ============ Phone 2: Activity ============ -->
  <g transform="translate(490,40)">
    <rect width="300" height="520" rx="40" fill="#14171c"/>
    <rect x="8" y="8" width="284" height="504" rx="33" fill="#f3f4f7"/>
    <text x="28" y="60" class="f h">Akash's iPhone</text>
    <text x="28" y="78" class="f s">Today · 6 sessions</text>
    <rect x="20" y="92" width="260" height="96" rx="18" fill="#fff"/>
    <g class="f">
      <text x="34" y="114" class="lbl">MOST USED</text>
      <text x="34" y="134" font-size="11.5" fill="#14171c">YouTube</text><text x="266" y="134" text-anchor="end" font-size="11" fill="#6b7280">34 min</text>
      <rect x="34" y="140" width="232" height="5" rx="2.5" fill="#f1f2f6"/><rect x="34" y="140" width="232" height="5" rx="2.5" fill="#ff6a00"/>
      <text x="34" y="164" font-size="11.5" fill="#14171c">Instagram</text><text x="266" y="164" text-anchor="end" font-size="11" fill="#6b7280">17 min</text>
      <rect x="34" y="170" width="232" height="5" rx="2.5" fill="#f1f2f6"/><rect x="34" y="170" width="116" height="5" rx="2.5" fill="#ff6a00"/>
    </g>
    <rect x="20" y="198" width="260" height="246" rx="18" fill="#fff"/>
    <g class="f">
      <text x="34" y="220" class="lbl">TIMELINE</text>
      <line x1="41" y1="232" x2="41" y2="432" stroke="#e6e8ee" stroke-width="2"/>
      <text x="34" y="244" class="lbl">8 PM</text>
      <circle cx="41" cy="262" r="5" fill="#ff6a00" stroke="#fff" stroke-width="3"/>
      <text x="56" y="258" class="s">8:10 – 8:44 PM · 34 min</text><text x="56" y="273" class="t">YouTube</text>
      <text x="34" y="300" class="lbl">9 PM</text>
      <circle cx="41" cy="318" r="5" fill="#ff6a00" stroke="#fff" stroke-width="3"/>
      <text x="56" y="314" class="s">9:05 – 9:22 PM · 17 min</text><text x="56" y="329" class="t">Instagram</text>
      <circle cx="41" cy="356" r="5" fill="#ff6a00" stroke="#fff" stroke-width="3"/>
      <text x="56" y="352" class="s">9:30 – 9:31 PM · 1 min</text><text x="56" y="367" class="t">WhatsApp</text>
      <text x="34" y="394" class="lbl">10 PM</text>
      <circle cx="41" cy="412" r="5" fill="#ff6a00" stroke="#fff" stroke-width="3"/>
      <text x="56" y="408" class="s">10:00 – 10:06 PM · 6 min</text><text x="56" y="423" class="t">moneycontrol.com</text>
    </g>
    <text x="34" y="472" class="f s">Show background services (78 lookups)</text>
    <text x="150" y="560" text-anchor="middle" class="f cap">Know what's being used</text>
    <text x="150" y="582" text-anchor="middle" class="f capS">Apps &amp; sites, background noise filtered out</text>
  </g>

  <!-- ============ Phone 3: Speed limits ============ -->
  <g transform="translate(884,40)">
    <rect width="300" height="520" rx="40" fill="#14171c"/>
    <rect x="8" y="8" width="284" height="504" rx="33" fill="#f3f4f7"/>
    <text x="28" y="60" class="f h">Speed limits</text>
    <rect x="20" y="76" width="260" height="196" rx="18" fill="#fff"/>
    <g class="f">
      <text x="34" y="102" class="t">Limit everyone except</text>
      <text x="34" y="118" class="t">full-speed devices</text>
      <rect x="222" y="96" width="44" height="26" rx="13" fill="#12a150"/><circle cx="253" cy="109" r="10" fill="#fff"/>
      <text x="34" y="148" class="s">Download limit (Mbps)</text>
      <rect x="34" y="156" width="110" height="34" rx="10" fill="#f3f4f7" stroke="#e6e8ee"/><text x="46" y="178" font-size="13" fill="#14171c">10</text>
      <text x="156" y="148" class="s">Upload limit (Mbps)</text>
      <rect x="156" y="156" width="110" height="34" rx="10" fill="#f3f4f7" stroke="#e6e8ee"/><text x="168" y="178" font-size="13" fill="#14171c">3</text>
      <rect x="34" y="204" width="232" height="36" rx="11" fill="#f1f2f6"/><text x="150" y="227" text-anchor="middle" font-size="12" font-weight="600" fill="#14171c">Save limits</text>
      <text x="34" y="260" class="s">Others get 10 / 3 Mbps · 6 router rules</text>
    </g>
    <rect x="20" y="282" width="260" height="162" rx="18" fill="#fff"/>
    <g class="f">
      <text x="34" y="306" class="lbl">FULL SPEED</text>
      <rect x="34" y="318" width="30" height="30" rx="9" fill="#f1f2f6"/><rect x="46.0" y="327.0" width="10" height="16" rx="2.5" fill="none" stroke="#14171c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M49.5 340.0h3" fill="none" stroke="#14171c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="74" y="331" class="t">Akash's iPhone</text><text x="74" y="345" class="s">192.168.1.2 · fixed IP</text>
      <line x1="34" y1="360" x2="266" y2="360" stroke="#e6e8ee"/>
      <rect x="34" y="372" width="30" height="30" rx="9" fill="#f1f2f6"/><rect x="43.0" y="383.0" width="16" height="10" rx="1.5" fill="none" stroke="#14171c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M41.0 396.0h20" fill="none" stroke="#14171c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="74" y="385" class="t">This Mac</text><text x="74" y="399" class="s">192.168.1.3 · fixed IP</text>
      <line x1="34" y1="414" x2="266" y2="414" stroke="#e6e8ee"/>
      <text x="34" y="434" class="s">New devices are limited automatically</text>
    </g>
    <text x="150" y="560" text-anchor="middle" class="f cap">Share bandwidth fairly</text>
    <text x="150" y="582" text-anchor="middle" class="f capS">Full speed for the devices that matter</text>
  </g>
</svg>
